<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>

    <link rel="stylesheet" href="cadastro.css">


    <script src="" defer></script>
</head>

<body>
        
        <section id="formulario">
            <h3>Cadastro de Pessoas Físicas</h3>

            <form id="form-pessoa">
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" class="input01" required maxlength="60" [(ngModel)]="nome"
                    placeholder="Digite o seu nome">
                
                <label for="email">Email</label>
                <input type="text" name="email" id="email" class="input01" required maxlength="60" [(ngModel)]="email"
                    placeholder="Digite o seu email">

                <label for="cpf">CPF</label>
                <input type="text" name="cpf" id="cpf" class="input02" required maxlength="14" [(ngModel)]="cpf"
                    placeholder="Digite o seu CPF">

                <label for="uf">UF</label>
                <select name="uf" id="uf" class="elem-form-02" [(ngModel)]="uf">
                    <option value="">UF</option>
                    <option value="SE">SE</option>
                    <option value="BA">BA</option>
                    <option value="AL">AL</option>
                </select>
                 
                <label for="cidade">Cidade</label>
                <select name="cidade" id="cidade" class="elem-form-02" [(ngModel)]="cidade">
                    <option value="">Cidade</option>
                    <option value="Aracaju">Aracaju</option>
                    <option value="São Cristovão">São Cristovão</option>
                    <option value="Barra dos Coqueiros">Barra dos Coqueiros</option>
                </select>

                <label for="sexo">Sexo</label>
                <input type="radio" name="sexo" id="sexoM" class="inputOP" value="M" [(ngModel)]="sexo"> Masculino
                <input type="radio" name="sexo" id="sexoF" class="inputOP" value="F" [(ngModel)]="sexo"> Feminino
                <input type="radio" name="sexo" id="sexoN" class="inputOP" value="N" [(ngModel)]="sexo"> Não Declarar

                <div id="div-dados-endereco" class="oculto">
                    <label for="logradouro">Logradouro</label>
                    <input type="text" name="logradouro" id="logradouro" class="input01" [(ngModel)]="logradouro">

                    <label for="num-residencia">Número</label>
                    <input type="text" name="num-residencia" id="num-residencia" class="input02" maxlength="10" placeholder="Digite o número da residencia" required [(ngModel)]="numResidencia">

                    <label for="complemento-end">Complemento</label>
                    <input type="text" name="complemento-end" id="complemento-end" class="input01" maxlength="100" placeholder="Digite o número da residencia" [(ngModel)]="complementoEnd">

                    <label for="bairro">Bairro</label>
                    <input type="text" name="bairro" id="bairro" class="input01" [(ngModel)]="bairro">

                    <label for="localidade">localidade</label>
                    <input type="text" name="localidade" id="localidade" class="input01" [(ngModel)]="localidade">

                    <label for="uf">UF</label>
                    <input type="text" name="uf" id="uf" class="input02" [(ngModel)]="uf">
                </div>

                <label for="senha"> Senha </label>
                <input type="password" name="senha"  id="senha" class="input02" required maxlength="6" [(ngModel)]="senha"
                    placeholder="Informe a senha">
                
                <div id="div-btns">
                    <button type="submit" id="btn-add"> Cadastrar </button>
                    <button type="reset" id="btn-limpar">Limpar</button>
                </div>

            </form>
        </section>


</body>

</html>
