<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>

    <link rel="stylesheet" href="cadastro.css">


    <script src="" defer></script>
</head>

<body>

    <section id="formulario">
        <h3>Cadastro de Pessoas Físicas</h3>

        <form id="form-pessoa">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" class="input01" required maxlength="60" [(ngModel)]="nome"
                placeholder="Digite o seu nome">

            <label for="email">Email</label>
            <input type="text" name="email" id="email" class="input01" required maxlength="60" [(ngModel)]="email"
                placeholder="Digite o seu email">

            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" name="dataNascimento" id="dataNascimento" [(ngModel)]="dataNascimento"
                class="elem-form-02" required>

            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf" class="input02" required maxlength="14" [(ngModel)]="cpf"
                placeholder="Digite o seu CPF">

            <label for="uf">UF</label>
            <select name="uf" id="uf" class="elem-form-02" [(ngModel)]="uf">
                <option value="">UF</option>
                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AP">AP</option>
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MT">MT</option>
                <option value="MS">MS</option>
                <option value="MG">MG</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PR">PR</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RS">RS</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="SC">SC</option>
                <option value="SP">SP</option>
                <option value="SE">SE</option>
                <option value="TO">TO</option>
            </select>

            <label for="cidade">Cidade</label>
            <select name="cidade" id="cidade" class="elem-form-02" [(ngModel)]="cidade">
                <option value="">Cidade</option>
                <option value="Aracaju">Aracaju</option>
                <option value="Belém">Belém</option>
                <option value="Belo Horizonte">Belo Horizonte</option>
                <option value="Boa Vista">Boa Vista</option>
                <option value="Brasília">Brasília</option>
                <option value="Campo Grande">Campo Grande</option>
                <option value="Cuiabá">Cuiabá</option>
                <option value="Curitiba">Curitiba</option>
                <option value="Florianópolis">Florianópolis</option>
                <option value="Fortaleza">Fortaleza</option>
                <option value="Goiânia">Goiânia</option>
                <option value="João Pessoa">João Pessoa</option>
                <option value="Macapá">Macapá</option>
                <option value="Maceió">Maceió</option>
                <option value="Manaus">Manaus</option>
                <option value="Natal">Natal</option>
                <option value="Palmas">Palmas</option>
                <option value="Porto Alegre">Porto Alegre</option>
                <option value="Porto Velho">Porto Velho</option>
                <option value="Recife">Recife</option>
                <option value="Rio Branco">Rio Branco</option>
                <option value="Rio de Janeiro">Rio de Janeiro</option>
                <option value="Salvador">Salvador</option>
                <option value="São Luís">São Luís</option>
                <option value="São Paulo">São Paulo</option>
                <option value="Teresina">Teresina</option>
                <option value="Vitória">Vitória</option>
            </select>

            <label for="sexo">Sexo</label>
            <input type="radio" name="sexo" id="sexoM" class="inputOP" value="M" [(ngModel)]="sexo"> Masculino
            <input type="radio" name="sexo" id="sexoF" class="inputOP" value="F" [(ngModel)]="sexo"> Feminino
            <input type="radio" name="sexo" id="sexoN" class="inputOP" value="N" [(ngModel)]="sexo"> Não Declarar

            <label for="senha"> Senha </label>
            <input type="password" name="senha" id="senha" class="input02" required maxlength="6" [(ngModel)]="senha"
                placeholder="Informe a senha">

            <div id="div-btns">
                <button type="button" id="btnSalvar" (click)="save()"> Cadastrar </button>
                <button type="reset" id="btnLimpar" (click)="limpaAtributos()"> Limpar </button>
            </div>

        </form>
    </section>


</body>

</html>
